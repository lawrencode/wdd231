<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Nampa Valley Chamber social preview</title>
  <desc id="desc">A chamber banner with a mountain skyline and business directory messaging.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#143d59"/>
      <stop offset="100%" stop-color="#0d2d43"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f4b267"/>
      <stop offset="100%" stop-color="#d9773d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="980" cy="130" r="70" fill="url(#sun)" opacity="0.95"/>
  <path d="M0 430 L210 290 L350 380 L520 250 L760 420 L920 310 L1200 430 V630 H0 Z" fill="#dfeaf7" opacity="0.96"/>
  <path d="M0 520 H1200 V630 H0 Z" fill="#0e2f45" opacity="0.9"/>
  <rect x="80" y="80" width="150" height="150" rx="28" fill="#ffffff" opacity="0.11"/>
  <path d="M120 195 L150 130 L205 178 L281 92 L352 195 Z" fill="#ffffff" opacity="0.9"/>
  <text x="120" y="365" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800">Nampa Valley</text>
  <text x="120" y="435" fill="#f7d2a6" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="600">Chamber of Commerce</text>
  <text x="120" y="505" fill="#ebf3ff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">Member Directory</text>
</svg>
