<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan your Samoan getaway with a travel checklist, favorite activities, and local recommendations." />
    <meta name="author" content="Lawren Talamaivao" />
    <title>Plan a Samoan Getaway</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/large.css" />
    <script type="module" src="scripts/app.js" defer></script>
  </head>
  <body data-page="planner">
    <header class="site-header">
      <a href="index.html" class="brand" aria-label="Ala Mai Samoa home">
        <img src="favicon.svg" alt="Ala Mai Samoa logo" class="brand-logo" />
        <div class="brand-text">
          <span class="brand-name">Ala Mai</span>
          <span class="brand-tag">Samoa</span>
        </div>
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav id="primary-nav" class="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="experiences.html">Experiences</a>
        <a href="planner.html" class="active">Planner</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section class="page-heading">
        <p class="eyebrow">Build your itinerary</p>
        <h1>Plan a meaningful Samoan trip.</h1>
      </section>

      <section class="planner-layout">
        <form id="plannerForm" class="planner-form">
          <label>
            Trip focus
            <select id="tripFocus">
              <option value="beach">Beach escape</option>
              <option value="culture">Culture & heritage</option>
              <option value="adventure">Adventure & hiking</option>
              <option value="food">Food & wellness</option>
            </select>
          </label>

          <label>
            Number of days
            <input id="tripDays" type="number" min="2" max="14" value="5" />
          </label>

          <label>
            Preferred island
            <select id="tripIsland">
              <option value="Upolu">Upolu</option>
              <option value="Savai'i">Savai'i</option>
              <option value="Apia">Apia</option>
            </select>
          </label>

          <label>
            Travel style
            <select id="tripStyle">
              <option value="relaxed">Relaxed</option>
              <option value="active">Active</option>
              <option value="family">Family-friendly</option>
              <option value="romantic">Romantic</option>
            </select>
          </label>

          <button type="submit" class="button primary">Save my plan</button>
        </form>

        <aside class="planner-summary">
          <h2>Your quick plan</h2>
          <div id="plannerOutput" class="planner-output" aria-live="polite"></div>
        </aside>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-row">
        <div>
          <h3>Ala Mai Samoa</h3>
          <p>Travel with intention and joy.</p>
        </div>
        <div class="footer-links">
          <a href="attributions.html">Attributions</a>
          <a href="https://www.youtube.com/watch?v=ScMzIvxBSi4" target="_blank" rel="noopener noreferrer">Demo video</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>
      <p class="copyright">© <span id="year"></span> Ala Mai Samoa</p>
    </footer>
  </body>
</html>
