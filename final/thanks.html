<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Thank you for contacting Ala Mai Samoa. Your island travel request has been received." />
    <meta name="author" content="Lawren Talamaivao" />
    <title>Thanks for contacting Ala Mai Samoa</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/large.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="index.html" class="brand" aria-label="Ala Mai Samoa home">
        <img src="favicon.svg" alt="Ala Mai Samoa logo" class="brand-logo" />
        <div class="brand-text">
          <span class="brand-name">Ala Mai</span>
          <span class="brand-tag">Samoa</span>
        </div>
      </a>
    </header>

    <main class="thank-you">
      <div class="thank-you-card">
        <p class="eyebrow">Message received</p>
        <h1>Thank you for reaching out.</h1>
        <p>
          We will review your Samoan travel interests and reach back soon with ideas for your next island getaway.
        </p>
        <a class="button primary" href="index.html">Back to home</a>
      </div>
    </main>

    <footer class="site-footer">
      <p class="copyright">© <span id="year"></span> Ala Mai Samoa</p>
    </footer>
  </body>
</html>
